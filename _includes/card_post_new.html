<article class="post-card" aria-labelledby="home-card-1">
  <div class="card-content">
    <div class="card-image"><img src="https://picsum.photos/seed/storm-approaching/600/400.jpg"
        alt="{{post.title}}" width="600" height="400" loading="lazy"><time
        class="date-badge">15 set. 2023</time></div>
    <div class="card-text">
       <h3>
        <a class="card-link" href="{{post.url | prepend: site.baseurl}}">
          {{post.title}}
        </a>
      </h3>
      <p>A aproximação de frentes meteorológicas transforma a montanha e cria contrastes dramáticos entre luz, sombra e
        relevo.</p>
      <div class="tags"><span class="tag">Meteorologia</span><span class="tag">Montanha</span></div>
      <div class="card-stats" aria-label="Dados do percurso"><span class="stat-item"><i class="fas fa-route"
            aria-hidden="true"></i>12,4 km</span><span class="stat-item"><i class="fas fa-mountain"
            aria-hidden="true"></i>680 m</span><span class="stat-item"><i class="fas fa-clock" aria-hidden="true"></i>4h
          10m</span></div>
    </div>
  </div>
</article>
