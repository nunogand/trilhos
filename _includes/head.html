{%- assign site_title = site.title | default: "Trilhos" -%}
{%- assign meta_description = page.description | default: site.description -%}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} – {% endif %}{{ site_title | escape }}</title>
{% if meta_description %}<meta name="description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">{% endif %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abel&family=Inter:wght@400;500;600;700&display=swap">

<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">

<link rel="stylesheet" href="{{ '/assets/css/trilhos.css' | relative_url }}">
