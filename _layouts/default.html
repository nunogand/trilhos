<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

 
  <!-- Primary Meta Tags -->
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  
   <link rel="stylesheet" href="{{ '/assets/css/trilhos.css' | relative_url }}">

 {% if page.leaflet == "true" %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  {% endif %}

  {% if page.layout == 'percurso' %}
    <link rel="stylesheet" href="{{ '/assets/css/percurso.css' | relative_url }}">
  {% endif %}
</head>

<body>
{% include navigation.html %}

{{content}}

{% include footer.html %}

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>

  {% if page.layout == 'percurso' %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" defer></script>
    <script src="{{ '/assets/js/trail-map.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/trail-gallery.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/percurso.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
